name: Ecosystem Agent Plugins

on:
  pull_request:
    paths:
      - "ecosystem-agent-plugins/**"
      - ".github/workflows/ecosystem-agent-plugins.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "ecosystem-agent-plugins/**"
      - ".github/workflows/ecosystem-agent-plugins.yml"

defaults:
  run:
    working-directory: ecosystem-agent-plugins

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-ecosystem-${{ hashFiles('ecosystem-agent-plugins/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-ecosystem-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run type check
        run: pnpm type-check
