specVersion: v0.1.0

package:
  name: kelp-rseth-backing-alerts
  version: v0.1.0
  description: Kelp rsETH backing monitor — matches Graphitti RPC workflow (mainnet + Arbitrum supply vs pool backing)

imports:
  arbitrum_supply:
    file: ../kelp-rseth-arbitrum-supply/substreams.yaml

protobuf:
  files:
    - kelp_backing.proto
    - entity.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/kelp_rseth_backing_alerts.wasm

network: mainnet

modules:
  - name: map_backing_snapshots
    kind: map
    initialBlock: 19000000
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: arbitrum_supply:store_arb_rseth_supply
        mode: get
    output:
      type: proto:kelp.backing.v1.BackingSnapshots

  - name: graph_out
    kind: map
    inputs:
      - map: map_backing_snapshots
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges
