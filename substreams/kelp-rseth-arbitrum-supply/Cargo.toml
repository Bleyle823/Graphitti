[workspace]

[package]
name = "kelp_rseth_arbitrum_supply"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"
hex = "0.4"

[build-dependencies]
substreams-ethereum = "0.11"
prost-build = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
