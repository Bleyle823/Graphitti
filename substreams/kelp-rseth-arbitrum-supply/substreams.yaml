specVersion: v0.1.0

package:
  name: kelp-rseth-arbitrum-supply
  version: v0.1.0
  description: rsETH OFT totalSupply on Arbitrum for Kelp backing monitor (cross-chain store)

protobuf:
  files:
    - kelp_backing.proto
  importPaths:
    - ../kelp-rseth-backing-alerts/proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/kelp_rseth_arbitrum_supply.wasm

network: arbitrum-one

modules:
  - name: map_arb_rseth_supply
    kind: map
    initialBlock: 150000000
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:kelp.backing.v1.ArbRsethSupply

  - name: store_arb_rseth_supply
    kind: store
    updatePolicy: set
    valueType: proto:kelp.backing.v1.ArbRsethSupply
    inputs:
      - map: map_arb_rseth_supply
